<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 교체 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* 밝은 화면 하나로만 간다. 뷰어가 어두운 테마여도 이 값이 그대로 쓰이도록
     모든 색을 여기서 정하고 body에 배경을 명시한다. */
  :root{
    color-scheme:light;
    --paper:#f6f5f2; --surface:#fff; --surface-2:#efeeea;
    --ink:#1b1d21; --ink-soft:#5d636d; --ink-faint:#6f7580;
    --line:#e2e0da; --line-strong:#cdcac2;
    --absent:#8a3d63; --absent-fill:#f4e7ee; --absent-edge:#dcbccc;
    --cover:#1a6b66; --cover-fill:#e1efee; --cover-edge:#aacfcb;
    --warn:#8a5a12; --warn-fill:#f7eeda; --warn-edge:#e2cfa4;
    --shadow:0 1px 2px rgba(27,29,33,.05), 0 8px 22px -14px rgba(27,29,33,.28);
    --step:clamp(14px,.55vw + 12.4px,15.5px);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:var(--step); line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:34px 22px 90px}
  h1,h2,h3{font-family:"Gowun Batang",Batang,serif; font-weight:700; text-wrap:balance; margin:0}
  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); font-family:"IBM Plex Mono",monospace;
  }

  /* ── 머리말 ───────────────────────────── */
  .masthead{display:flex; flex-direction:column; gap:6px; padding-bottom:22px; border-bottom:1px solid var(--line)}
  .masthead h1{font-size:clamp(26px,3vw,34px); letter-spacing:-.01em}
  .masthead p{margin:0; color:var(--ink-soft); font-size:14px}
  .masthead .src{color:var(--ink-faint); font-size:12.5px}

  /* ── 조건 바 ──────────────────────────── */
  .console{
    position:sticky; top:0; z-index:20; margin:22px 0 0;
    background:var(--surface); border:1px solid var(--line); border-radius:3px;
    box-shadow:var(--shadow); padding:16px 18px;
  }
  .console-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; align-items:end}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0}
  .field > span{font-size:11.5px; font-weight:600; letter-spacing:.09em; color:var(--ink-faint); text-transform:uppercase; font-family:"IBM Plex Mono",monospace}
  select, input[type="date"]{
    width:100%; appearance:none; font:inherit; font-size:14px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line-strong); border-radius:2px;
    padding:9px 30px 9px 11px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 16px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  input[type="date"]{background-image:none; padding-right:11px; cursor:text; min-height:41px}
  .console-row{display:flex; gap:14px; align-items:flex-end; margin-top:14px; flex-wrap:wrap}
  .console-row .field{flex:1 1 320px}
  .field .lab{display:flex; align-items:baseline; gap:8px}
  .field .lab b{font-size:12px; font-weight:600; letter-spacing:0; text-transform:none;
    font-family:inherit; color:var(--absent)}
  .field .lab b.day{color:var(--cover)}
  .periods{display:flex; flex-wrap:wrap; gap:5px; align-items:stretch}
  .pchip{position:relative; display:flex}
  .pchip > span{flex:1}
  .pchip input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer}
  .pchip > span{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    min-width:66px; min-height:47px; padding:5px 7px; border-radius:2px;
    background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  }
  .pchip .pn{font-size:14px; font-weight:600; line-height:1; font-style:normal}
  .pchip .pw{font-size:10.5px; line-height:1; white-space:nowrap; color:var(--ink-faint); font-style:normal}
  .pchip input:checked + span{background:var(--absent-fill); border-color:var(--absent); color:var(--absent)}
  .pchip input:checked + span .pw{color:var(--absent); opacity:.85}
  .pchip.all > span{min-width:60px; font-size:12.5px}
  .pchip input:indeterminate + span{border-style:dashed}
  .pchip input:focus-visible + span{outline:2px solid var(--cover); outline-offset:2px}
  .periods .sep{width:1px; align-self:stretch; background:var(--line-strong); margin:0 4px}
  select:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--cover); outline-offset:2px}
  .go{
    font:inherit; font-size:14px; font-weight:600; color:var(--paper); background:var(--ink);
    border:1px solid var(--ink); border-radius:2px; padding:10px 18px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap; transition:opacity .15s;
  }
  .go:hover{opacity:.85}
  .go[disabled]{opacity:.5; cursor:progress}
  .form-help{margin:13px 0 0; font-size:12.5px; color:var(--ink-soft); line-height:1.6}
  .form-help b{color:var(--ink); font-weight:600}

  /* ── 요약 ─────────────────────────────── */
  .tally{display:grid; grid-template-columns:repeat(auto-fit,minmax(122px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:26px}
  .tally div{background:var(--surface); padding:13px 15px; display:flex; flex-direction:column; gap:2px}
  .tally span{font-size:11.5px; letter-spacing:.08em; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}
  .tally strong{font-size:23px; font-weight:500; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; line-height:1.25}
  .tally .hl-from strong{color:var(--absent)}
  .tally .hl-to strong{color:var(--cover)}

  .banner{
    margin-top:26px; padding:15px 18px; border:1px solid var(--line);
    border-left:3px solid var(--absent); background:var(--surface); border-radius:2px;
  }
  .banner strong{font-size:15.5px}
  .banner p{margin:3px 0 0; color:var(--ink-soft); font-size:13.5px}
  .banner.none{border-left-color:var(--line-strong)}

  .heading{margin:38px 0 16px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .heading h2{font-size:19px}
  .heading p{margin:0; color:var(--ink-soft); font-size:13px}

  /* ── 조합 카드 ────────────────────────── */
  .plans{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px}
  .plan{background:var(--surface); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden}
  .plan.best{border-color:var(--cover-edge)}
  .plan-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--line)}
  .plan-top h3{font-size:16.5px}
  .plan-name{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
  .day-tag{
    font-size:13px; font-weight:600; white-space:nowrap; color:var(--paper);
    background:var(--ink); padding:4px 10px; border-radius:2px;
  }
  .chip{font-size:11px; font-weight:600; letter-spacing:.05em; padding:3px 8px; border-radius:2px; white-space:nowrap; font-family:"IBM Plex Mono",monospace}
  .chip.full{color:var(--cover); background:var(--cover-fill); border:1px solid var(--cover-edge)}
  .chip.part{color:var(--warn); background:var(--warn-fill); border:1px solid var(--warn-edge)}
  .load{font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; margin-top:3px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .meter{display:inline-flex; gap:3px; align-items:center}
  .meter i{display:block; width:14px; height:6px; border-radius:1px; background:var(--line)}
  .meter em{font-style:normal; margin-left:5px}
  .meter.low i.on{background:var(--cover)}   .meter.low em{color:var(--cover)}
  .meter.mid i.on{background:var(--warn)}    .meter.mid em{color:var(--warn)}
  .meter.high i.on{background:var(--absent)} .meter.high em{color:var(--absent)}
  /* 계산 근거는 접어 둔다 */
  .why{margin-top:26px; border:1px solid var(--line); border-radius:3px; background:var(--surface)}
  .why summary{cursor:pointer; padding:11px 16px; font-size:13.5px; font-weight:600; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; list-style:none}
  .why summary::before{content:""; display:inline-block; width:0; height:0; border-left:5px solid var(--ink-faint); border-top:4px solid transparent; border-bottom:4px solid transparent; margin-right:2px; transition:transform .15s}
  .why[open] summary::before{transform:rotate(90deg)}
  .why summary span{font-weight:400; color:var(--ink-faint); font-size:12.5px}
  .why[open] summary{border-bottom:1px solid var(--line)}
  .why-note{margin:10px 16px 0; font-size:13px; color:var(--ink-soft)}
  .why .lesson{margin:0 16px}
  .why[open]{padding-bottom:12px}

  /* 주간 격자 미니맵 */
  .week{padding:14px 16px 8px; display:grid; grid-template-columns:16px repeat(5,1fr); gap:2px; max-width:242px}
  .wd{font-size:10px; text-align:center; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; padding-bottom:3px}
  .wp{font-size:9.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; display:grid; place-items:center}
  .wc{
    height:19px; border:1px solid var(--line); border-radius:1px; background:transparent;
    display:grid; place-items:center; font-size:10px; font-weight:600;
    font-family:"IBM Plex Mono",monospace; color:transparent;
  }
  .wc.off{border-color:transparent}
  .wc.busy{background:var(--surface-2); border-color:var(--line-strong)}
  .wc.from{background:var(--absent-fill); border-color:var(--absent); color:var(--absent)}
  .wc.to{background:var(--cover-fill); border-color:var(--cover); color:var(--cover)}
  .wc.miss{background:repeating-linear-gradient(135deg,transparent,transparent 3px,var(--line-strong) 3px,var(--line-strong) 4px); border-color:var(--line-strong)}

  .steps{list-style:none; margin:0; padding:4px 16px 0; display:flex; flex-direction:column; gap:11px}
  .steps li{display:grid; grid-template-columns:20px 1fr; gap:10px; align-items:start}
  .idx{
    width:20px; height:20px; border-radius:50%; display:grid; place-items:center;
    font-size:10.5px; font-weight:600; font-family:"IBM Plex Mono",monospace; margin-top:2px;
    background:var(--cover-fill); color:var(--cover); border:1px solid var(--cover-edge);
  }
  .idx.gap{background:var(--warn-fill); color:var(--warn); border-color:var(--warn-edge)}
  .swap{font-size:13.5px; line-height:1.55}
  .swap-head{display:flex; align-items:baseline; gap:8px; margin-bottom:7px}
  .swap-head b{font-size:14.5px; font-weight:600}
  .swap-head span{font-size:12px; color:var(--ink-faint)}
  .swap-head .tag{
    font-size:10.5px; font-weight:600; color:var(--ink-soft); padding:2px 6px;
    background:var(--surface-2); border:1px solid var(--line-strong); border-radius:2px;
  }
  .moves{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);
    gap:6px 9px; align-items:baseline; padding:9px 11px; border-radius:3px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .moves > span{min-width:0; overflow-wrap:anywhere}
  .mv-slot{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-variant-numeric:tabular-nums;
    color:var(--ink-faint); white-space:nowrap;
  }
  .mv-was{font-size:12.5px; color:var(--ink-soft)}
  .mv-arw{color:var(--ink-faint); font-size:12px}
  .mv-now{font-size:12.5px}
  .mv-now b{font-weight:600; color:var(--ink)}
  .moves i{font-style:normal; color:var(--ink-faint)}
  .mv-now i{color:var(--cover); font-weight:500}
  .swap b{font-weight:600}
  .swap .sub{display:block; color:var(--ink-soft); font-size:12.5px; margin-top:1px}
  .swap .slot{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .room{
    display:inline-block; margin-left:5px; padding:1px 6px; border-radius:2px;
    white-space:nowrap;
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
    color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line);
  }

  .room.need{color:var(--warn); background:var(--warn-fill); border-color:var(--warn-edge)}
  .strain{
    display:block; margin-top:5px; font-size:11.5px; color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace;
  }
  .strain.hard{color:var(--warn); font-weight:500}
  .strain.over{color:var(--absent); font-weight:600}
  .repeat{
    display:flex; flex-wrap:wrap; gap:6px; margin:10px 16px 0; padding-top:9px;
    border-top:1px dashed var(--line); font-size:11.5px; color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace;
  }
  .repeat b{color:var(--ink); font-weight:600}
  .advise{
    margin:14px 16px 0; padding:11px 13px; border:1px solid var(--warn-edge);
    background:var(--warn-fill); border-radius:2px;
  }
  .advise strong{display:block; font-size:13px; color:var(--warn); margin-bottom:3px}
  .advise p{margin:0; font-size:12.5px; line-height:1.65; color:var(--ink-soft)}
  .advise b{color:var(--ink); font-weight:600}
  .plan-foot{margin-top:auto; padding:14px 16px; display:flex; gap:8px}
  .ghost{
    font:inherit; font-size:12.5px; font-weight:500; color:var(--ink-soft);
    background:transparent; border:1px solid var(--line-strong); border-radius:2px;
    padding:7px 13px; cursor:pointer; transition:border-color .15s,color .15s;
  }
  .ghost:hover{border-color:var(--ink-soft); color:var(--ink)}
  .paste{margin:0 16px 14px; width:calc(100% - 32px); font-family:"IBM Plex Mono",monospace; font-size:11px;
    border:1px solid var(--line-strong); border-radius:2px; background:var(--surface-2); color:var(--ink);
    padding:9px; min-height:96px; resize:vertical}

  /* ── 수업별 후보 ──────────────────────── */
  .lesson{background:var(--surface); border:1px solid var(--line); border-radius:3px; margin-bottom:11px; overflow:hidden}
  .lesson summary{
    padding:13px 16px; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap;
    list-style:none; font-size:14.5px;
  }
  .lesson summary::-webkit-details-marker{display:none}
  .lesson summary::after{content:"＋"; margin-left:auto; color:var(--ink-faint); font-size:15px}
  .lesson[open] summary::after{content:"－"}
  .lesson[open] summary{border-bottom:1px solid var(--line)}
  .per{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:2px;
    color:var(--absent); background:var(--absent-fill); border:1px solid var(--absent-edge); white-space:nowrap;
  }
  .cnt{margin-left:6px; font-size:12.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}
  .cands{list-style:none; margin:0; padding:11px 16px 15px; display:grid; gap:8px}
  .cands li{display:flex; gap:10px; align-items:baseline; font-size:13.5px; padding-bottom:8px; border-bottom:1px dotted var(--line)}
  .cands li:last-child{border-bottom:0; padding-bottom:0}
  .cands b{color:var(--cover); font-weight:600; min-width:66px}
  .cands span{color:var(--ink-soft); font-size:12.5px}

  .empty{
    border:1px dashed var(--line-strong); border-radius:3px; padding:34px 22px; text-align:center;
    color:var(--ink-soft); background:var(--surface); font-size:14px;
  }
  .empty strong{display:block; color:var(--ink); font-size:16px; margin-bottom:5px; font-family:"Gowun Batang",serif}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin:0 0 16px}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:1px; margin-right:6px; vertical-align:-1px; border:1px solid}
  .legend .f{background:var(--absent-fill); border-color:var(--absent)}
  .legend .t{background:var(--cover-fill); border-color:var(--cover)}
  .legend .b{background:var(--surface); border-color:var(--line-strong)}
  .legend .m{background:repeating-linear-gradient(135deg,transparent,transparent 3px,var(--line-strong) 3px,var(--line-strong) 4px); border-color:var(--line-strong)}

  /* 화면 전환 */
  .tabs{display:flex; gap:2px; margin:20px 0 0; border-bottom:1px solid var(--line)}
  .tab{
    font:inherit; font-size:14px; font-weight:500; color:var(--ink-faint); background:none;
    border:0; border-bottom:2px solid transparent; padding:9px 15px; cursor:pointer; margin-bottom:-1px;
  }
  .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--cover); font-weight:600}
  .panel[hidden]{display:none}

  /* 전체 시간표 */
  .tt-controls{display:flex; gap:14px; align-items:end; flex-wrap:wrap; margin:24px 0 0}
  .seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:2px; overflow:hidden}
  .seg button{
    font:inherit; font-size:13px; color:var(--ink-soft); background:var(--surface);
    border:0; padding:9px 15px; cursor:pointer;
  }
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:600}
  .tt-wrap{overflow-x:auto; border:1px solid var(--line); background:var(--surface); border-radius:3px; margin-top:16px}
  table.tt{border-collapse:collapse; width:100%; min-width:660px; font-size:13px}
  table.tt th, table.tt td{border:1px solid var(--line); padding:7px 8px; text-align:center; vertical-align:middle}
  table.tt thead th{
    background:var(--surface-2); font-weight:600; font-size:12px; color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace; letter-spacing:.04em;
  }
  table.tt tbody th{
    background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:11.5px;
    color:var(--ink-faint); font-weight:500; width:46px;
  }
  table.tt tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 45%, transparent)}
  table.tt td{height:48px}
  table.tt td.free{background:var(--paper)}
  table.tt tbody tr:nth-child(even) td.free{background:var(--paper)}
  table.tt td:hover{background:var(--cover-fill); border-color:var(--cover-edge)}
  .tt-sub{display:block; font-weight:600; font-size:13px}
  .tt-meta{display:block; font-size:11.5px; color:var(--ink-soft); margin-top:1px}
  .all-wrap{overflow:auto; max-height:78vh; border:1px solid var(--line); background:var(--surface); border-radius:3px; margin-top:16px}
  table.all{border-collapse:separate; border-spacing:0; font-size:11px}
  table.all th, table.all td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:3px 5px; text-align:center; white-space:nowrap}
  table.all thead th{
    position:sticky; top:0; z-index:3; background:var(--surface-2); color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600; padding:4px 5px; min-width:52px;
  }
  table.all thead th span{display:block; color:var(--ink-faint); font-weight:400}
  table.all th.cn{
    position:sticky; left:0; z-index:2; background:var(--surface-2); min-width:46px;
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink); font-weight:600;
  }
  table.all thead th.cn{z-index:4}
  table.all .daystart{border-left:2px solid var(--line-strong)}
  table.all td{height:34px; color:var(--ink)}
  table.all td b{display:block; font-weight:600; font-size:11px}
  table.all td i{display:block; font-style:normal; font-size:9.5px; color:var(--ink-faint); margin-top:1px}
  table.all tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
  table.all td.sp{color:var(--ink-faint)}
  table.all td.none{background:var(--paper)}
  /* 교체안을 적용해 보면 바뀐 칸이 서른 개 표 안에 흩어져 눈에 잘 안 띈다.
     천천히 숨쉬듯 물들었다 옅어지게 해 어디가 달라졌는지 바로 찾게 한다.
     움직임을 꺼 둔 분에게는 아래 prefers-reduced-motion 규칙이 멈춰 준다. */
  table.all td.moved{background:var(--cover-fill); box-shadow:inset 0 0 0 1px var(--cover);

<script>/* 교체 수업 신고서(.hwpx) 채우기 — 첨부 양식의 section0.xml을 셀 주소로 채운다.
   브라우저와 Node에서 같은 코드를 쓴다. ZIP 입출력만 각자 처리한다. */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  root.HwpxFill = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const TBL_ID = '<hp:tbl id="2052365658"';
  const DAY_NUM = { 월: 1, 화: 2, 수: 3, 목: 4, 금: 5 };
  const HEAD_ROWS = 2;          // 그룹 머리글 + 열 머리글
  const BASE_ROWS = 8;          // 양식 원본 전체 행 수
  const NAME_REF = "8";         // 교체교사명 글자모양(양식이 그 칸에 쓰는 값)
  const CELL_REF = "10";        // 일반 칸 글자모양

  const xmlEscape = v => String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* 지정한 요일의 날짜 — 기준일 이후 가장 가까운 같은 요일 */
  function dateForDay(base, dayId) {
    const target = DAY_NUM[dayId];
    const d = new Date(base.getTime());
    if (target) d.setDate(d.getDate() + ((target - d.getDay() + 7) % 7));
    return d;
  }
  const monthDay = d => (d.getMonth() + 1) + "." + d.getDate();
  const spaced = name => String(name || "").split("").join(" ");
  /* 교과교실제라 학생이 담당 교사의 교실로 간다. 학반과 교실을 함께 적는다. */
  const where = (className, room) => room ? className + " (" + room + ")" : className;
  const schoolYear = d => (d.getMonth() + 1 >= 3 ? d.getFullYear() : d.getFullYear() - 1);

  /* 회전에 참여한 교시마다 한 행. 왼쪽은 원래 있던 수업, 오른쪽은 바뀐 뒤 들어갈 수업.
     맞교환(2개)이면 2행, 3개 회전이면 3행이 된다. */
  function rowsFor(steps, baseDate) {
    const rows = [];
    for (const s of steps) {
      for (const sl of s.slots) {
        const d = monthDay(dateForDay(baseDate, sl.day));
        rows.push({
          left:  [sl.beforeSubject, d, sl.day, String(sl.period), where(s.className, sl.beforeRoom), sl.beforeTeacher],
          right: [sl.afterSubject, d, sl.day, String(sl.period), where(s.className, sl.roomClash ? "교실 배정 필요" : sl.afterRoom), sl.afterTeacher],
        });
      }
    }
    return rows;
  }

  /* 표에서 (col,row) 칸의 첫 문단 글을 바꾼다 */
  function setCell(tbl, col, row, text, ref) {
    const addr = `<hp:cellAddr colAddr="${col}" rowAddr="${row}"/>`;
    const at = tbl.indexOf(addr);
    if (at < 0) throw new Error(`칸 (${col},${row})을 찾지 못했습니다`);
    const tcStart = tbl.lastIndexOf("<hp:tc", at);
    const pStart = tbl.indexOf("<hp:p ", tcStart);
    const pEnd = tbl.indexOf("</hp:p>", pStart);
    const para = tbl.slice(pStart, pEnd);
    const runRe = /<hp:run\b[^>]*?(?:\/>|>[\s\S]*?<\/hp:run>)/;
    if (!runRe.test(para)) throw new Error(`칸 (${col},${row})에 글자 요소가 없습니다`);
    const next = text === ""
      ? `<hp:run charPrIDRef="${ref}"/>`
      : `<hp:run charPrIDRef="${ref}"><hp:t>${xmlEscape(text)}</hp:t></hp:run>`;
    return tbl.slice(0, pStart) + para.replace(runRe, next) + tbl.slice(pEnd);
  }

  /* 빈 행을 복제해 6행을 넘는 교체도 담는다 */
  function growRows(tbl, need) {
    const trRe = /<hp:tr>[\s\S]*?<\/hp:tr>/g;
    const all = tbl.match(trRe);
    const last = all[all.length - 1];
    let extra = "";
    for (let r = BASE_ROWS; r < HEAD_ROWS + need; r += 1) {
      extra += last.replace(/rowAddr="\d+"/g, `rowAddr="${r}"`);
    }
    const insertAt = tbl.lastIndexOf("</hp:tr>") + "</hp:tr>".length;
    const grown = tbl.slice(0, insertAt) + extra + tbl.slice(insertAt);
    return grown.replace(/(<hp:tbl\b[^>]*?\srowCnt=")\d+(")/, `$1${HEAD_ROWS + need}$2`);
  }

  /* section0.xml 전체를 채운다 */
  function fillSection(xml, data) {
    const start = xml.indexOf(TBL_ID);
    if (start < 0) throw new Error("신고서 표를 찾지 못했습니다");
    const end = xml.indexOf("</hp:tbl>", start) + "</hp:tbl>".length;
    let tbl = xml.slice(start, end);

    const rows = data.rows;
    const capacity = BASE_ROWS - HEAD_ROWS;
    if (rows.length > capacity) tbl = growRows(tbl, rows.length);
    const total = Math.max(capacity, rows.length);

    for (let i = 0; i < total; i += 1) {
      const r = HEAD_ROWS + i;
      const row = rows[i];
      for (let c = 0; c < 6; c += 1) tbl = setCell(tbl, c, r, row ? row.left[c] : "", CELL_REF);
      for (let c = 0; c < 5; c += 1) tbl = setCell(tbl, 6 + c, r, row ? row.right[c] : "", CELL_REF);
      tbl = setCell(tbl, 11, r, row ? row.right[5] : "", NAME_REF);
      tbl = setCell(tbl, 12, r, "", CELL_REF);
    }

    let out = xml.slice(0, start) + tbl + xml.slice(end);
    out = out.replace(/<hp:t>\d{4}학년도<\/hp:t>/, `<hp:t>${data.schoolYear}학년도</hp:t>`);
    out = out.replace(/<hp:t>사유 :\s*[^<]*<\/hp:t>/, `<hp:t>사유 :         ${xmlEscape(data.reason)}</hp:t>`);
    out = out.replace(/<hp:t>신고 교사 :\s*[^<]*<\/hp:t>/, `<hp:t>신고 교사 :   ${xmlEscape(spaced(data.teacherName))}   </hp:t>`);
    return out;
  }

  /* 파일 탐색기 미리보기용 텍스트 — 원본과 같은 모양으로 다시 만든다 */
  function buildPrvText(data) {
    const cells = a => "<" + a.join("><") + ">";
    const lines = [
      `${data.schoolYear}학년도<일과계><부장><교감>`,
      "< ><><>",
      "         교체 수업 신고서",
      "",
      ` 사유 :         ${data.reason}                                                  신고 교사 :   ${spaced(data.teacherName)}   (서명 또는 인)`,
      "<수업 시간표 내역><수업 교체 내역><비고>",
      cells(["과목", "월 일", "요일", "교시", "학년 반", "수업교사명", "과목", "월 일", "요일", "교시", "학년 반", "교체교사명 (서명 또는 인)"]),
    ];
    const capacity = Math.max(BASE_ROWS - HEAD_ROWS, data.rows.length);
    for (let i = 0; i < capacity; i += 1) {
      const r = data.rows[i];
      lines.push(r
        ? cells(r.left.concat(r.right.slice(0, 5), r.right[5] + " (서명 또는 인)", ""))
        : cells(["", "", "", "", "", "", "", "", "", "", "", " (서명 또는 인)", ""]));
    }
    // 담임 교체서는 손으로 적는 칸이라 양식 그대로 비워 둔다.
    lines.push("", "담임 교체서",
      cells(["학년 반", "담 임", "교체 담임  (서명 또는 인)", "기간", "비고"]),
      cells(["", "", " (서명 또는 인)", "", ""]));
    return lines.join("\n") + "\n";
  }

  return { fillSection, buildPrvText, rowsFor, dateForDay, monthDay, spaced, schoolYear };
});
</script>

/* 수업 교체 계산기 — 학교 규칙, 시간표 색인, 교체안 탐색(solve)
   화면 코드는 하나도 들어 있지 않다. 이 파일 한 벌을 두 곳이 같이 쓴다.

   ① 이 앱: build.mjs가 template.html의 __ENGINE__ 자리표시자에 그대로 끼워 넣는다.
      같은 <script> 안에 들어가므로 화면 코드가 여기 이름들(solve, ACTIVE, T …)을 바로 쓴다.
   ② 서버(AI 교무실 등): 전역 DATA(timetable.json)를 넣고 돌린 뒤 필요한 이름만 꺼낸다.
        vm.runInNewContext(src + "\n;({ solve, ACTIVE, T, C })", { DATA })
      규칙(부장 명단, 하루 한도 …)을 바꾸면 여기만 고치면 되고, 두 곳이 함께 바뀐다.

   실행 전에 전역 DATA가 있어야 한다. KEEP_FREE가 DATA.teachers의 slotStates를 고쳐 쓰므로
   한 번 쓴 DATA를 다른 계산기에 다시 넣지 않는다. */

/* ── 학교 규칙 ─────────────────────────── */
/* 보강을 부탁하지 않는 사람 — 부장교사와 신고 당사자.
   부장 여부는 시간표 자료에 없으므로 이름으로 관리한다. 바뀌면 여기만 고치면 된다. */
const BUJANG = ["박정미", "강한주", "오지영", "성은아", "이은홍", "최현",
                "이제현", "전제광", "김은경", "임슬기", "조민택"];
const NO_COVER = [...BUJANG, "이승열"];   // 이승열은 신고 당사자

/* 강사가 맡아 다른 교사로 대체할 수 없는 수업. 교체 대상에도, 상대 후보에도 넣지 않는다. */
const NO_SWAP = [
  { subject: "운동" },                        // 이서윤·임이경·이종영
  { subject: "중국", days: ["목", "금"] },    // 목·금 강사 수업
];
const noSwap = l => NO_SWAP.some(r => r.subject === l.subject && (!r.days || r.days.includes(l.day)));

/* 회의·업무로 반드시 비워 두는 시간. 여기로는 어떤 수업도 옮기지 않는다. */
const KEEP_FREE = [
  { who: [...BUJANG, "이승열"], day: "목", periods: [1] },
  { who: ["심재경", "이승열"], day: "목", periods: [2, 3] },
];
/* ── 색인: 원본은 배정 960건을 매번 훑지만, 여기서는 미리 묶어 둔다 ── */
const T = new Map(DATA.teachers.map(t => [t.id, t]));
const C = new Map(DATA.classes.map(c => [c.id, c]));
const DAY_IX = new Map(DATA.days.map((d, i) => [d.id, i]));
const byTeacherDay = new Map();   // "tid|요일" → 수업[]
const byTeacherSlot = new Map();  // "tid|요일-교시" → 수업
const byTeacher = new Map();      // tid → 수업[]
for (const l of DATA.schedule) {
  if (!l.teacherId) continue;
  const dk = l.teacherId + "|" + l.day;
  if (!byTeacherDay.has(dk)) byTeacherDay.set(dk, []);
  byTeacherDay.get(dk).push(l);
  byTeacherSlot.set(l.teacherId + "|" + l.day + "-" + l.period, l);
  if (!byTeacher.has(l.teacherId)) byTeacher.set(l.teacherId, []);
  byTeacher.get(l.teacherId).push(l);
}
for (const rule of KEEP_FREE) {
  for (const t of DATA.teachers) {
    if (!rule.who.includes(t.name)) continue;
    for (const p of rule.periods) t.slotStates[rule.day + "-" + p] = "unavailable";
  }
}
const ACTIVE = DATA.teachers.filter(t => byTeacher.has(t.id));
const byClassSlot = new Map();   // "cid|요일-교시" → 수업
const byRoomSlot = new Map();    // "교실|요일-교시" → 수업
const byClass = new Map();       // cid → 수업[]
const byClassDay = new Map();    // "cid|요일" → 수업[]
for (const l of DATA.schedule) {
  const dk = l.classId + "|" + l.day;
  if (!byClassDay.has(dk)) byClassDay.set(dk, []);
  byClassDay.get(dk).push(l);
  byClassSlot.set(l.classId + "|" + l.day + "-" + l.period, l);
  if (!byClass.has(l.classId)) byClass.set(l.classId, []);
  byClass.get(l.classId).push(l);
  if (l.room) byRoomSlot.set(l.room + "|" + l.day + "-" + l.period, l);
}

/* 미술은 두 시간을 이어서 하는 블록 수업이다. 두 칸을 한 덩어리로 다루려고 묶어 둔다. */
const byBlock = new Map();       // blockId → 수업[] (교시 순)
for (const l of DATA.schedule) {
  if (!l.blockId) continue;
  if (!byBlock.has(l.blockId)) byBlock.set(l.blockId, []);
  byBlock.get(l.blockId).push(l);
}
for (const g of byBlock.values()) g.sort((a, b) => a.period - b.period);

const consecutiveMax = periods => {
  const s = [...new Set(periods)].sort((a, b) => a - b);
  let max = 0, run = 0, prev = -100;
  for (const p of s) { run = p === prev + 1 ? run + 1 : 1; prev = p; if (run > max) max = run; }
  return max;
};
const cls = id => C.get(id)?.name || id;   // 자료의 학급 이름 "1-1" — 신고서에 그대로 쓴다
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
/* 결강 교시는 고른 번호 목록이다. 붙어 있지 않아도 된다 — 1교시와 5교시만 비는 날도 있다. */
const inWindow = (day, period, sel) => day === sel.day && sel.periods.indexOf(period) >= 0;

/* 해당 교사·요일의 교시 목록 — 결강분은 빼고, 임시로 떠맡은 수업은 더해서 */
function periodsOn(tid, day, temp, omit, sel) {
  const out = [];
  for (const l of byTeacherDay.get(tid + "|" + day) || []) {
    if (omit.has(l.id)) continue;
    if (tid === sel.teacherId && inWindow(l.day, l.period, sel)) continue;
    out.push(l.period);
  }
  for (const t of temp) if (t.teacherId === tid && t.day === day) out.push(t.period);
  return out;
}
/* 한도를 넘는 날의 목록. 넘어도 막지 않고 적는다 — 학교가 그렇게 정했다(2026-09-09).
   빈 목록이면 모든 날이 한도 안이다. */
function overLoad(teacher, temp, omit, sel) {
  const out = [];
  for (const d of DATA.days) {
    const p = periodsOn(teacher.id, d.id, temp, omit, sel);
    const cap = capFor(teacher.id, d.id), runCap = consecFor(teacher.id, d.id), run = consecutiveMax(p);
    if (p.length > cap || run > runCap) {
      out.push({ teacher: teacher.name, day: d.id, count: p.length, cap, run, runCap,
                 dayOver: p.length > cap, runOver: run > runCap });
    }
  }
  return out;
}

const stateAt = (teacher, day, period) => teacher.slotStates[day + "-" + period] || "available";

/* 하루에 설 수 있는 최대 수업 수. 학교 규칙이며 교사별 값보다 우선한다.
   월·수·금은 6교시, 화·목은 7교시여서 한도가 다르다.
   자료에 들어 있던 교사별 일일 최대는 현재 시간표에서 뽑아낸 추정값이라 쓰지 않는다. */
const DAILY_CAP = { 월: 5, 화: 6, 수: 5, 목: 6, 금: 5 };
const CONSEC_CAP = 4;                    // 연달아 설 수 있는 최대 시간. 3연강은 정상으로 본다.
const capOf = day => DAILY_CAP[day] || 5;

/* 하루에 몰아서 근무하는 강사처럼 이미 한도를 넘겨 짜인 경우가 있다.
   그 상태는 그대로 인정하되, 교체로 거기서 더 늘어나지는 않게 한다. */
const capFor = (teacherId, day) =>
  Math.max(capOf(day), (byTeacherDay.get(teacherId + "|" + day) || []).length);
const consecFor = (teacherId, day) =>
  Math.max(CONSEC_CAP, consecutiveMax((byTeacherDay.get(teacherId + "|" + day) || []).map(l => l.period)));
/* 이 회전이 각 교사의 하루를 얼마나 무겁게 만드는지, 교체 전후를 비교한다.
   한도를 넘는 안은 이미 걸러졌으므로 여기서 잡히는 것은 "합법이지만 부담되는" 경우다. */
const touchedDays = moves => {
  const out = new Set();
  for (const m of moves) {
    out.add(m.teacherId + "|" + m.from);   // 빠져나가는 날
    out.add(m.teacherId + "|" + m.to);     // 새로 들어가는 날
  }
  return out;
};
function strainOf(touched, temp, usedIds, add, omit, sel) {
  const notes = [];
  for (const key of touched) {
    const at = key.lastIndexOf("|");
    const tid = key.slice(0, at), day = key.slice(at + 1);
    const t = T.get(tid);
    if (!t) continue;
    const before = periodsOn(tid, day, temp, usedIds, sel);
    const after = periodsOn(tid, day, add, omit, sel);
    const beforeRun = consecutiveMax(before), afterRun = consecutiveMax(after);
    const cap = capFor(tid, day);
    if (after.length > cap || afterRun > consecFor(tid, day)) continue;      // 넘는 날은 따로 "한도 초과"로 적는다
    const runUp = afterRun >= 4 && afterRun > beforeRun;                    // 4연속이 새로 생김
    const loadUp = after.length > before.length && after.length >= cap;   // 하루 한도까지 참
    if (!runUp && !loadUp) continue;
    notes.push({
      teacher: t.name, day, runUp, loadUp,
      run: afterRun, maxRun: consecFor(tid, day),
      count: after.length, maxCount: cap,
      heavy: loadUp,          // 하루가 한도까지 찬 경우. 무리 판정은 안 전체를 보고 따로 한다.
    });
  }
  return notes;
}

/* 어느 교사가 어느 학년·학급에 들어가는지 — 같은 학년 선생님을 먼저 권하기 위해 */
const teacherGrades = new Map(), teacherClasses = new Map();
for (const l of DATA.schedule) {
  if (!l.teacherId) continue;
  if (!teacherGrades.has(l.teacherId)) teacherGrades.set(l.teacherId, new Set());
  if (!teacherClasses.has(l.teacherId)) teacherClasses.set(l.teacherId, new Set());
  const g = C.get(l.classId) && C.get(l.classId).grade;
  if (g) teacherGrades.get(l.teacherId).add(g);
  teacherClasses.get(l.teacherId).add(l.classId);
}

/* 그 교시에 수업이 없는 교사 — 보강을 부탁할 수 있는 사람들.
   담당 과목이나 총 시수는 따지지 않는다. 시수가 많아도 그 시간에 비어 있으면 후보다.
   같은 반, 그 다음 같은 학년에 들어가는 선생님을 앞세운다. */
function freeTeachersAt(day, period, sel, classId) {
  const grade = classId && C.get(classId) && C.get(classId).grade;
  const out = [];
  for (const t of DATA.teachers) {
    if (t.id === sel.teacherId || !byTeacher.has(t.id)) continue;
    if (NO_COVER.includes(t.name)) continue;
    if (!t.allowedDays.includes(day)) continue;
    if (stateAt(t, day, period) === "unavailable") continue;
    if (byTeacherSlot.has(t.id + "|" + day + "-" + period)) continue;
    const after = (byTeacherDay.get(t.id + "|" + day) || []).map(l => l.period).concat(period);
    if (after.length > capFor(t.id, day) || consecutiveMax(after) > consecFor(t.id, day)) continue;
    out.push({
      name: t.name, subjects: t.subjects.join("/"),
      sameClass: Boolean(classId && teacherClasses.get(t.id) && teacherClasses.get(t.id).has(classId)),
      sameGrade: Boolean(grade && teacherGrades.get(t.id) && teacherGrades.get(t.id).has(grade)),
      grade, load: after.length, max: capFor(t.id, day),
      run: consecutiveMax(after), prefers: stateAt(t, day, period) === "prefer",
    });
  }
  out.sort((a, b) =>
    (b.sameClass - a.sameClass) || (b.sameGrade - a.sameGrade) ||
    (b.prefers - a.prefers) || (a.run - b.run) || (a.load - b.load) ||
    a.name.localeCompare(b.name, "ko"));
  return out;
}

/* 보강 후보 한 명을 사람이 읽는 문구로 */
function coverLabel(f) {
  const tag = f.sameClass ? "이 반 담당" : f.sameGrade ? f.grade + "학년 담당" : "";
  const inner = [f.subjects, tag].filter(Boolean).join(", ");
  return esc(f.name) + (inner ? "(" + esc(inner) + ")" : "");
}

/* 무리한 교체 — 한 안에서 하루 한도까지 차는 교사가 둘 이상 나올 때.
   교체 자체는 규칙을 지키지만 여러 사람이 동시에 빡빡해지는 안이다.
   연속 4시간은 허용 범위라 표시만 하고 무리의 사유로 삼지 않는다. */
const heavyTeachers = plan =>
  [...new Set(plan.steps.flatMap(s => s.strain || []).filter(n => n.heavy).map(n => n.teacher))];
const overNotes = plan => plan.steps.flatMap(s => s.over || []);
const planIsHard = plan => heavyTeachers(plan).length >= 2 || overNotes(plan).length > 0;
const overLine = n => n.teacher + " 선생님 " + n.day + "요일 " +
  [n.dayOver ? "하루 " + n.count + "시간 (한도 " + n.cap + ")" : "", n.runOver ? "연속 " + n.run + "시간 (한도 " + n.runCap + ")" : ""].filter(Boolean).join(" · ");

function hardReason(n) {
  return n.teacher + " 선생님 " + n.day + "요일 " + n.count + "시간(한도 " + n.maxCount + ")";
}

const CYCLE_MAX = 3;      // 한 회전에 참여하는 수업 수 상한
const SUBJECT_CAP = 2;   // 한 반이 하루에 같은 과목을 받을 수 있는 최대 시간
const ROOM_WEIGHT = 12;
const OVER_WEIGHT = 60;  // 한도를 넘는 날 하나당 — 다른 어떤 안보다 뒤에 서게  // 교실을 새로 잡아야 하는 자리 하나당 더하는 부담 — 이틀 떨어진 값과 비슷하다
/* 상대 선생님의 주당 시수가 평균보다 적으면 부담을 덜고, 많으면 더한다.
   시수가 적은 분(진로·종교 등)과의 안을 앞세우기로 학교가 정했다(2026-09-09). */
const LOAD_WEIGHT = 1;
const AVG_HOURS = DATA.schedule.filter(l => l.teacherId).length / Math.max(1, ACTIVE.length);
const loadTerm = tid => Math.round(((byTeacher.get(tid) || []).length - AVG_HOURS) * LOAD_WEIGHT);

/* 결강 수업을 같은 반 안에서 다른 교시로 보낸다.
   반의 모든 교시가 차 있으므로 옮기면 반드시 누군가를 밀어내고, 그 사슬은 결국
   원래 자리로 돌아온다. 즉 언제나 회전이다. 길이 2면 두 수업의 맞교환이고,
   3이면 세 수업이 자리를 한 칸씩 돈다. 어느 쪽이든 모든 교사가 자기 과목을
   그대로 가르치므로 보강이 생기지 않고, 반이 주당 받는 과목 수도 변하지 않는다.

   미술 블록은 남이 건드리지 못한다. 다른 과목이 결강했을 때 상대 후보에서 빼므로
   블록이 남의 사정으로 흔들리는 일은 없다. 반대로 미술 선생님 본인이 결강하면
   자기 수업이니 두 시간을 통째로 옮기거나 한 시간씩 쪼개어 옮길 수 있다.
   둘 다 함께 보여 주되, 통째로 가는 안은 점수를 조금 우대해 앞쪽에 둔다. */
function optionsFor(unit, temp, usedIds, limit, sel) {
  const lesson = unit.head;
  const own = new Set(unit.lessons.map(x => x.id));
  const absent = T.get(sel.teacherId);
  if (unit.lessons.some(x => x.locked || x.type === "special")) return [];   // 창체·고정수업은 옮길 수 없다
  if (unit.lessons.some(x => noSwap(x))) return [];                          // 강사 수업은 교체하지 않는다

  const pool = (byClass.get(lesson.classId) || []).filter(x =>
    !own.has(x.id) && !usedIds.has(x.id) &&
    !(x.type === "special" || x.locked) &&
    !noSwap(x) &&
    x.teacherId && x.teacherId !== absent.id &&
    !inWindow(x.day, x.period, sel));                     // 결강 시간대로는 옮길 수 없다
  const singles = pool.filter(x => !x.blockId);           // 남의 블록은 상대 후보가 아니다

  const weigh = state => state === "avoid" ? 12 : state === "prefer" ? -6 : 0;
  const found = [];

  /* item 수업이 (day, period)로 갈 수 있는가. leaving은 이번 교체로 자리를 비우는 수업들. */
  function canGo(item, day, period, leaving) {
    const t = T.get(item.teacherId);
    if (!t || !t.allowedDays.includes(day)) return false;
    if (stateAt(t, day, period) === "unavailable") return false;
    const busy = byTeacherSlot.get(t.id + "|" + day + "-" + period);
    if (busy && !leaving.has(busy.id)) return false;
    if (temp.some(x => x.teacherId === t.id && x.day === day && x.period === period)) return false;
    /* 한 반이 하루에 같은 과목을 받는 시간은 두 시간까지다. 미술 연강이 그 두 시간을
       쓰는 형태이고, 지금 시간표에도 그 밖에 두 번을 넘기는 자리는 없다. */
    const same = (byClassDay.get(item.classId + "|" + day) || [])
        .filter(x => x.subject === item.subject && x.id !== item.id && !leaving.has(x.id)).length
      + temp.filter(x => x.classId === item.classId && x.day === day && x.subject === item.subject).length;
    if (same + 1 > SUBJECT_CAP) return false;
    return true;
  }

  /* 교과교실이 그 시간에 비어 있는가. 비어 있지 않아도 교체를 막지는 않는다 —
     교실은 일과계가 쉽게 다시 배정하므로, 대신 "교실 배정 필요"로 적어 둔다. */
  function roomFree(item, day, period, leaving) {
    if (!item.room) return true;
    const inRoom = byRoomSlot.get(item.room + "|" + day + "-" + period);
    if (inRoom && !leaving.has(inRoom.id)) return false;
    return !temp.some(x => x.room === item.room && x.day === day && x.period === period);
  }

  /* before 자리에 after 수업이 들어온다 — 화면과 신고서가 함께 쓰는 한 줄 */
  const mkSlot = (before, after, leaving) => ({
    day: before.day, period: before.period,
    beforeSubject: before.subject, beforeTeacher: T.get(before.teacherId).name,
    beforeRoom: before.room || "",
    afterSubject: after.subject, afterTeacher: T.get(after.teacherId).name,
    afterRoom: after.room || "",
    roomClash: !roomFree(after, before.day, before.period, leaving),   // 들어오는 수업의 교실이 그 시간에 차 있음
  });

  /* 사슬의 마지막 수업을 결강 교시로 되돌려 회전을 닫는다 */
  function close(chain) {
    const leaving = new Set(chain.map(x => x.id));
    if (!canGo(chain[chain.length - 1], lesson.day, lesson.period, leaving)) return;

    const add = temp.slice();
    for (let i = 0; i < chain.length; i += 1) {
      const to = chain[(i + 1) % chain.length];
      add.push({ teacherId: chain[i].teacherId, day: to.day, period: to.period, room: chain[i].room || "",
                 classId: chain[i].classId, subject: chain[i].subject });
    }
    const omit = new Set(usedIds);
    for (const x of chain) omit.add(x.id);
    const over = [];
    for (const id of new Set(chain.map(x => x.teacherId))) over.push(...overLoad(T.get(id), add, omit, sel));

    let score = (chain.length - 2) * 30;   // 짧은 회전을 강하게 우선한다
    let avoided = false;
    const slots = chain.map((before, i) => {
      const after = chain[(i - 1 + chain.length) % chain.length];   // 이 자리로 들어오는 수업
      const st = stateAt(T.get(after.teacherId), before.day, before.period);
      if (st === "avoid") avoided = true;
      score += weigh(st) + Math.abs(DAY_IX.get(before.day) - DAY_IX.get(after.day)) * 3;
      return mkSlot(before, after, leaving);
    });
    const clashes = slots.filter(sl => sl.roomClash).length;
    score += clashes * ROOM_WEIGHT;                            // 교실을 새로 잡아야 하는 안은 조금 뒤로
    for (const x of chain.slice(1)) score += loadTerm(x.teacherId);   // 상대의 주당 시수

    const strain = strainOf(touchedDays(chain.map((x, i) =>
      ({ teacherId: x.teacherId, from: x.day, to: chain[(i + 1) % chain.length].day }))),
      temp, usedIds, add, omit, sel);
    const heavy = strain.filter(n => n.heavy).length;
    found.push({
      lessonId: lesson.id, classId: lesson.classId, className: cls(lesson.classId),
      kind: "cycle", length: chain.length, own: 1, fixed: 1, roomClashes: clashes,
      label: chain.length === 2 ? "두 수업 맞교환" : chain.length + "개 수업 자리 이동",
      sameDay: slots.every(sl => sl.day === lesson.day),
      slots, avoided, strain, heavy, over,
      score: score + strain.length * 6 + heavy * 18 + over.length * OVER_WEIGHT,   // 부담되는 안은 뒤로, 한도를 넘는 안은 맨 뒤로
      usedIds: chain.slice(1).map(x => x.id),
      temp: add.slice(temp.length),
    });
  }

  function extend(chain) {
    if (chain.length >= 2) close(chain);
    if (chain.length >= CYCLE_MAX) return;
    const prev = chain[chain.length - 1];
    const leaving = new Set(chain.map(x => x.id));
    for (const cand of singles) {
      if (chain.some(x => x.id === cand.id)) continue;
      const next = new Set(leaving); next.add(cand.id);
      if (!canGo(prev, cand.day, cand.period, next)) continue;   // prev가 cand의 자리로 간다
      extend(chain.concat(cand));
    }
  }

  /* 블록 두 칸과 붙어 있는 낱개 두 칸이 통째로 자리를 맞바꾼다.
     블록은 언제나 두 칸이 이어진 채로 움직이므로 수업이 쪼개지지 않는다.
     pair는 같은 요일에 연달아 붙은 두 수업이고 교시 순으로 들어온다. */
  function exchange(block, pair) {
    const leaving = new Set(block.concat(pair).map(x => x.id));
    for (const s of pair) if (!canGo(block[0], s.day, s.period, leaving)) return;

    for (const flip of [0, 1]) {   // 두 수업을 블록이 비운 두 칸에 넣는 두 가지 배치
      const to = flip ? [block[1], block[0]] : [block[0], block[1]];
      if (!canGo(pair[0], to[0].day, to[0].period, leaving)) continue;
      if (!canGo(pair[1], to[1].day, to[1].period, leaving)) continue;

      const moves = [
        { from: block[0], to: pair[0] }, { from: block[1], to: pair[1] },
        { from: pair[0], to: to[0] }, { from: pair[1], to: to[1] },
      ];
      const add = temp.concat(moves.map(m =>
        ({ teacherId: m.from.teacherId, day: m.to.day, period: m.to.period, room: m.from.room || "",
           classId: m.from.classId, subject: m.from.subject })));
      const omit = new Set(usedIds);
      for (const x of block.concat(pair)) omit.add(x.id);
      const over = [];
      for (const id of new Set(moves.map(m => m.from.teacherId))) over.push(...overLoad(T.get(id), add, omit, sel));

      let score = -15, avoided = false;   // 블록이 붙은 채로 남으므로 쪼개는 안보다 앞에 둔다
      for (const m of moves) {
        const st = stateAt(T.get(m.from.teacherId), m.to.day, m.to.period);
        if (st === "avoid") avoided = true;
        score += weigh(st);
      }
      /* 요일이 멀수록 무겁다. 자리 두 쌍이 맞바뀌는 것이므로 낱개 맞교환과 같이 두 번만 센다 —
         움직이는 수업이 넷이라고 네 번 세면 블록이 까닭 없이 뒤로 밀린다. */
      score += Math.abs(DAY_IX.get(block[0].day) - DAY_IX.get(pair[0].day)) * 6;

      const slots = [mkSlot(block[0], flip ? pair[1] : pair[0], leaving), mkSlot(block[1], flip ? pair[0] : pair[1], leaving),
                     mkSlot(pair[0], block[0], leaving), mkSlot(pair[1], block[1], leaving)];
      const clashes = slots.filter(sl => sl.roomClash).length;
      score += clashes * ROOM_WEIGHT;
      for (const x of pair) score += loadTerm(x.teacherId);

      const strain = strainOf(touchedDays(moves.map(m =>
        ({ teacherId: m.from.teacherId, from: m.from.day, to: m.to.day }))),
        temp, usedIds, add, omit, sel);
      const heavy = strain.filter(n => n.heavy).length;
      found.push({
        lessonId: lesson.id, classId: lesson.classId, className: cls(lesson.classId),
        kind: "block", length: 4, own: block.length, roomClashes: clashes,
        fixed: block.filter(x => inWindow(x.day, x.period, sel)).length,
        label: block[0].subject + " 블록 통째로 옮기고 두 수업이 그 자리로",
        sameDay: slots.every(sl => sl.day === lesson.day),
        slots, avoided, strain, heavy, over,
        score: score + strain.length * 6 + heavy * 18 + over.length * OVER_WEIGHT,
        usedIds: block.concat(pair).filter(x => !own.has(x.id)).map(x => x.id),
        temp: add.slice(temp.length),
      });
    }
  }

  extend([lesson]);                       // 한 시간씩 쪼개어 옮기는 안
  /* 결강한 수업이 블록의 한쪽이면, 두 시간을 붙인 채로 옮기는 안도 만든다.
     unit.block은 그 블록의 앞 교시 하나에만 달려 있어 같은 안이 두 번 나오지 않는다. */
  if (unit.block && !unit.block.some(x => usedIds.has(x.id))) {
    for (const s1 of singles) {
      const s2 = byClassSlot.get(s1.classId + "|" + s1.day + "-" + (s1.period + 1));
      if (s2 && singles.includes(s2)) exchange(unit.block, [s1, s2]);
    }
  }

  found.sort((a, b) => a.score - b.score || a.length - b.length);
  const seen = new Set(), unique = [];
  for (const o of found) {
    const key = o.slots.map(s => s.day + s.period).sort().join(",");
    if (seen.has(key)) continue;                                 // 같은 자리 집합은 한 번만
    seen.add(key); unique.push(o);
    if (unique.length >= limit) break;
  }
  return unique;
}
const NODE_CAP = 4000, PLAN_CAP = 60, SHOW = 12;

function solve(sel) {
  const absent = T.get(sel.teacherId);
  const affected = (byTeacher.get(sel.teacherId) || [])
    .filter(l => inWindow(l.day, l.period, sel))
    .sort((a, b) => a.period - b.period);
  /* 결강 수업 하나가 한 덩어리다. 블록이면 통째로 옮기는 안을 첫 교시에 얹어 둔다. */
  const units = [], seenBlock = new Set();
  for (const l of affected) {
    const u = { head: l, lessons: [l], block: null };
    if (l.blockId && !seenBlock.has(l.blockId)) {
      seenBlock.add(l.blockId);
      const g = byBlock.get(l.blockId);
      if (g && g.length === 2) u.block = g;
    }
    units.push(u);
  }
  // 수업별 후보는 계산된 것을 전부 보여 준다 — 접혀 있는 목록이라 길어도 된다
  const perLesson = units.map(u => ({ unit: u, lesson: u.head, options: optionsFor(u, [], new Set(), Infinity, sel) }));

  const plans = [];
  let nodes = 0;
  function walk(i, steps, temp, used, score, missed) {
    nodes += 1;
    if (nodes > NODE_CAP || plans.length >= PLAN_CAP) return;
    if (i >= units.length) {
      if (steps.length) plans.push({ steps: steps.slice(), missed: missed.slice(), score });
      return;
    }
    const unit = units[i];
    if (used.has(unit.head.id)) { walk(i + 1, steps, temp, used, score, missed); return; }   // 블록 통째 이동에 이미 실렸다
    /* 수업마다 SHOW개까지 본다. 6개로 자르면 한 교시 결강은 대안이 여섯 개를 넘지 못해,
       계산은 됐는데 화면에 못 오르는 안이 평균 넷 중 셋이었다. 탐색량은 넉넉하다(노드 상한의 4%). */
    for (const o of optionsFor(unit, temp, used, SHOW, sel)) {
      const nextUsed = new Set(used);
      for (const id of o.usedIds) nextUsed.add(id);
      walk(i + 1, steps.concat(o), temp.concat(o.temp), nextUsed, score + o.score, missed);
    }
    // 이 수업은 짝을 못 찾은 채로 두고 나머지를 계속 — 부분 조합
    walk(i + 1, steps, temp, used, score, missed.concat(unit.head));
  }
  if (units.length) walk(0, [], [], new Set(), 0, []);

  const seen = new Set(), unique = [];
  /* 못 메운 수업이 적은 안, 그다음 한도를 넘지 않는 안, 그다음 부담이 낮은 안.
     한도를 넘는 안은 적어서 보여 주되 한도 안의 안보다 앞에 서지 않는다. */
  const overCount = p => p.steps.reduce((k, s) => k + (s.over || []).length, 0);
  plans.sort((a, b) => a.missed.length - b.missed.length || overCount(a) - overCount(b) || a.score - b.score);
  for (const p of plans) {
    const key = p.steps.map(s => s.lessonId + ">" + s.slots.map(x => x.day + x.period).join("+")).join("|");
    if (seen.has(key)) continue;
    seen.add(key); unique.push(p);
    if (unique.length >= SHOW) break;
  }
  return { absent, sel, affected, perLesson, plans: unique, nodes,
           full: unique.filter(p => !p.missed.length).length };
}

/* ── 그리기 ───────────────────────────── */
const MAXP = Math.max(...DATA.days.map(d => d.periods));
/* 화면에는 "1학년 1반"으로 적는다. 자료와 신고서의 "1-1"은 그대로 둔다 — 종이 양식의 관례다.
   칸이 좁은 곳(교시 칸, 교사별 표)은 "1-1반". */
const classLong = id => { const c = C.get(id); if (!c) return id; const m = /^(\d+)-(\d+)$/.exec(c.name); return m ? m[1] + "학년 " + m[2] + "반" : c.name; };
const classShort = id => { const c = C.get(id); if (!c) return id; return /^\d+-\d+$/.test(c.name) ? c.name + "반" : c.name; };

/* 고른 교시를 사람이 읽는 문구로 — 하루 전체 / 2~4교시 / 1·5교시 */
function periodLabel(sel) {
  const d = DATA.days.find(x => x.id === sel.day);
  const ps = [...sel.periods].sort((a, b) => a - b);
  if (!ps.length) return "선택 없음";
  if (d && ps.length === d.periods) return "하루 전체";
  if (ps.length === 1) return ps[0] + "교시";
  const solid = ps.every((p, i) => i === 0 || p === ps[i - 1] + 1);
  return (solid ? ps[0] + "~" + ps[ps.length - 1] : ps.join("·")) + "교시";
}

function weekMap(plan, r) {
  const mark = new Map();
  for (const l of byTeacher.get(r.sel.teacherId) || []) mark.set(l.day + "-" + l.period, { k: "busy" });
  plan.steps.forEach((s, i) => {
    s.slots.forEach((sl, j) => mark.set(sl.day + "-" + sl.period, { k: j < (s.own || 1) ? "from" : "to", n: i + 1 }));
  });
  for (const l of plan.missed) mark.set(l.day + "-" + l.period, { k: "miss" });

  let html = '<div class="wd"></div>';
  for (const d of DATA.days) html += '<div class="wd">' + d.id + "</div>";
  for (let p = 1; p <= MAXP; p += 1) {
    html += '<div class="wp">' + p + "</div>";
    for (const d of DATA.days) {
      if (p > d.periods) { html += '<div class="wc off"></div>'; continue; }
      const m = mark.get(d.id + "-" + p);
      html += '<div class="wc ' + (m ? m.k : "") + '">' + (m && m.n ? m.n : "") + "</div>";
    }
  }
  return '<div class="week" role="img" aria-label="주간 시간표에서 교체가 일어나는 위치">' + html + "</div>";
}

const missReason = l => l.locked || l.type === "special" ? "고정수업이라 옮길 수 없음"
  : noSwap(l) ? "강사가 맡는 수업이라 교체하지 않음"
  : "같은 반 안에 옮길 자리가 없음";

function planText(plan, r) {
  const head = r.absent.name + " 선생님 " + r.sel.day + "요일 " + periodLabel(r.sel) + " " + r.sel.reason
    + (plan.steps.length ? " · 수업 교체안" : " · 보강 요청");
  const sameDay = plan.steps.length > 0 && plan.steps.every(s => s.sameDay);
  const mark = sameDay ? "  [같은 날 안에서]" : "";
  const rows = plan.steps.map((s, i) => [
    (i + 1) + ". " + classLong(s.classId) + " — " + s.label + (!sameDay && s.sameDay ? " (같은 날 안에서)" : ""),
    ...s.slots.map(sl => "   " + sl.day + " " + sl.period + "교시: " +
      sl.beforeSubject + "(" + sl.beforeTeacher + ") → " + sl.afterSubject + "(" + sl.afterTeacher + ")"),
  ].join("\n"));
  const strain = plan.steps.flatMap(s => (s.strain || []).map(n =>
    "· " + n.teacher + " 선생님 " + n.day + "요일 " +
    [n.runUp ? "연속 " + n.run + "시간" : "", n.loadUp ? "하루 " + n.count + "시간(한도 " + n.maxCount + ")" : ""].filter(Boolean).join(" · ")));
  const twice = repeatNotes(plan).map(x =>
    "· " + x.className + " " + x.day + "요일 " + x.subject + " " + x.count + "시간");
  const rooms = roomNotes(plan).map(x =>
    "· " + x.className + " " + x.day + " " + x.period + "교시 " + x.subject + " — " + x.room + "호가 그 시간에 사용 중, 교실 새로 배정");
  const overs = overNotes(plan).map(n => "· " + overLine(n));
  const miss = plan.missed.map(l => {
    const free = freeTeachersAt(l.day, l.period, r.sel, l.classId).slice(0, 4)
      .map(f => f.name + (f.sameClass ? "(이 반 담당)" : f.sameGrade ? "(" + f.grade + "학년)" : "")).join(", ");
    return "· " + l.day + " " + l.period + "교시 " + classLong(l.classId) + " " + l.subject + " — " + missReason(l) +
      (free ? " (이 시간 공강: " + free + ")" : "");
  });
  const hardNotes = planIsHard(plan)
    ? plan.steps.flatMap(s => s.strain || []).filter(n => n.heavy) : [];
  const advise = hardNotes.length || overs.length
    ? ["", "[권고] " + (overs.length
         ? [...new Set(overNotes(plan).map(n => n.teacher))].join("·") + " 선생님의 한도를 넘깁니다 — " + overNotes(plan).map(overLine).join(", ") + "."
         : heavyTeachers(plan).join("·") + " 선생님의 하루가 한도까지 찹니다 — " + hardNotes.map(hardReason).join(", ") + "."),
       "아래 공강 교사에게 보강을 부탁하는 편이 나을 수 있습니다.",
       ...freeTeachersAt(r.affected[0].day, r.affected[0].period, r.sel, r.affected[0].classId)
         .filter(f => !hardNotes.some(n => n.teacher === f.name)).slice(0, 5)
         .map(f => "· " + f.name + "(" + [f.subjects, f.sameClass ? "이 반 담당" : f.sameGrade ? f.grade + "학년 담당" : ""].filter(Boolean).join(", ") + ")")]
    : [];
  return [head + mark, "", ...rows,
    ...(strain.length ? ["", "[부담 확인]", ...strain] : []),
    ...(twice.length ? ["", "[같은 과목이 하루에 두 시간]", ...twice] : []),
    ...(rooms.length ? ["", "[교체는 가능하나 교실 배정 필요]", ...rooms] : []),
    ...(overs.length ? ["", "[한도 초과 — 규칙을 넘는 안입니다]", ...overs] : []),
    ...(miss.length ? ["", "[미해결]", ...miss] : []),
    ...advise].join("\n");
}

function strainLine(n) {
  const parts = [];
  if (n.runUp) parts.push("연속 " + n.run + "시간" + (n.run >= n.maxRun ? " (한도 " + n.maxRun + ")" : ""));
  if (n.loadUp) parts.push("하루 " + n.count + "시간 (한도 " + n.maxCount + ")");
  return esc(n.teacher) + " 선생님 " + n.day + "요일 " + parts.join(" · ");
}

function adviseBlock(plan, r) {
  if (!planIsHard(plan)) return "";
  const hardNotes = plan.steps.flatMap(s => s.strain || []).filter(n => n.heavy);
  const overs = overNotes(plan);
  const slot = r.affected[0];
  const strained = new Set(plan.steps.flatMap(s => s.strain || []).map(n => n.teacher).concat(overs.map(n => n.teacher)));
  const free = freeTeachersAt(slot.day, slot.period, r.sel, slot.classId)
    .filter(f => !strained.has(f.name)).slice(0, 5);
  const who = free.map(coverLabel).join(", ");
  const lead = overs.length
    ? "<strong>한도를 넘는 안입니다</strong>"
      + "<p>이 안은 <b>" + esc([...new Set(overs.map(n => n.teacher))].join("·")) + "</b> 선생님의 한도를 넘깁니다 — "
      + esc(overs.map(overLine).join(", ")) + ". "
    : "<strong>여러 선생님이 한도까지 찹니다</strong>"
      + "<p>이 안은 <b>" + esc(heavyTeachers(plan).join("·")) + "</b> 선생님의 하루를 한도까지 채웁니다 — "
      + esc(hardNotes.map(hardReason).join(", ")) + ". ";
  return '<div class="advise">' + lead
    + "교체를 밀어붙이기보다, " + slot.day + " " + slot.period + "교시에 공강인 선생님께 보강을 부탁하는 편이 나을 수 있습니다."
    + (who ? "<br><b>그 시간 공강</b> — " + who : " 다만 그 시간에 공강인 선생님이 없습니다.")
    + "</p></div>";
}

/* 이 안을 쓰면 한 반이 하루에 같은 과목을 두 시간 받게 되는 곳.
   규칙상 두 시간까지는 되므로 막지 않고, 보고 판단하시라고 적어만 둔다.
   원래부터 두 시간이던 미술 연강은 새로 생긴 것이 아니므로 뺀다. */
function repeatNotes(plan) {
  const after = new Map();   // "cid|요일-교시" → 바뀐 뒤 과목
  for (const s of plan.steps) {
    for (const sl of s.slots) after.set(s.classId + "|" + sl.day + "-" + sl.period, sl.afterSubject);
  }
  const out = [], seen = new Set();
  for (const s of plan.steps) {
    for (const day of new Set(s.slots.map(x => x.day))) {
      const key = s.classId + "|" + day;
      if (seen.has(key)) continue;
      seen.add(key);
      const was = new Map(), now = new Map();
      for (const l of byClassDay.get(key) || []) {
        was.set(l.subject, (was.get(l.subject) || 0) + 1);
        const sub = after.get(key + "-" + l.period) || l.subject;
        now.set(sub, (now.get(sub) || 0) + 1);
      }
      for (const [sub, cnt] of now) {
        if (cnt > 1 && cnt > (was.get(sub) || 0)) out.push({ className: classLong(s.classId), day, subject: sub, count: cnt });
      }
    }
  }
  return out;
}

/* 교실을 새로 잡아야 하는 자리. 교체 자체는 되므로 막지 않고 적어만 둔다. */
function roomNotes(plan) {
  const out = [];
  for (const s of plan.steps) {
    for (const sl of s.slots) {
      if (sl.roomClash) out.push({ className: classLong(s.classId), day: sl.day, period: sl.period, room: sl.afterRoom, subject: sl.afterSubject });
    }
  }
  return out;
}

/* 못 메운 수업 한 줄 — 사유와 그 시간 공강 선생님을 함께 적는다 */
function missedItem(l, r) {
  const free = freeTeachersAt(l.day, l.period, r.sel, l.classId).slice(0, 4);
  return `
    <li><span class="idx gap">—</span><div class="swap">
      <div class="swap-head"><b>${esc(classLong(l.classId))}</b>
        <span class="slot">${l.day} ${l.period}교시 ${esc(l.subject)}</span></div>
      <span class="sub">${esc(missReason(l))}.
      ${free.length ? "이 시간 공강: " + free.map(coverLabel).join(", ") + " — 보강을 부탁하세요."
                     : "이 시간에 공강인 선생님도 없습니다."}</span>
    </div></li>`;
}

/* 교체 조합이 하나도 없을 때 — 그래도 어느 수업이 비고 누가 공강인지는 알려 준다 */
function coverOnlyCard(r) {
  const blank = { steps: [], missed: r.affected };
  return `<article class="plan best">
    <div class="plan-top">
      <div><h3>교체로는 풀 수 없습니다</h3>
        <div class="load">같은 반 안에서 근무 요일·불가 교시·한도를 모두 만족하는 짝이 없습니다</div></div>
      <span class="chip part">보강 필요 ${r.affected.length}건</span>
    </div>
    ${weekMap(blank, r)}
    <ol class="steps">${r.affected.map(l => missedItem(l, r)).join("")}</ol>
    <div class="plan-foot"><button class="ghost" type="button" data-copy-cover="1">요약 복사</button></div>
  </article>`;
}

/* 부담 점수는 단계당 평균으로 본다 — 하루 전체 결강은 단계가 많아 합계만으로는 비교가 안 된다.
   30 이하는 짧은 맞교환 수준, 48을 넘으면 회전이 길거나 부담 표시가 붙은 안이다. */
function burdenOf(plan) {
  const per = plan.steps.length ? plan.score / plan.steps.length : 0;
  return per <= 30 ? { level: 1, word: "낮음", cls: "low" }
       : per <= 48 ? { level: 2, word: "보통", cls: "mid" }
       : { level: 3, word: "높음", cls: "high" };
}
function burdenMeter(plan) {
  const b = burdenOf(plan);
  return `<span class="meter ${b.cls}" title="부담 ${b.word}">` +
    [1, 2, 3].map(k => `<i class="${k <= b.level ? "on" : ""}"></i>`).join("") +
    `<em>부담 ${esc(b.word)}</em></span>`;
}

function planCard(plan, i, r) {
  const done = plan.steps.length, miss = plan.missed.length;
  const fixed = plan.steps.reduce((n, s) => n + (s.fixed || 1), 0);   // 해결한 결강 수업 수
  const sameDay = done > 0 && plan.steps.every(s => s.sameDay);       // 안 전체가 그날 안에서 돈다
  const repeats = repeatNotes(plan);                                  // 같은 과목이 하루에 두 시간 되는 곳
  const rooms = roomNotes(plan);                                      // 교실을 새로 잡아야 하는 곳
  const steps = plan.steps.map((s, n) => `
    <li><span class="idx">${n + 1}</span><div class="swap">
      <div class="swap-head"><b>${esc(classLong(s.classId))}</b>
        <span>${esc(s.label)}</span>${!sameDay && s.sameDay ? '<b class="tag" title="그날 학교에 남아 다른 교시에 이 수업을 합니다">같은 날</b>' : ""}</div>
      <div class="moves">
        ${s.slots.map(sl => `
          <span class="mv-slot">${sl.day} ${sl.period}</span>
          <span class="mv-was">${esc(sl.beforeSubject)} <i>${esc(sl.beforeTeacher)}</i>${sl.beforeRoom ? ` <span class="room">${esc(sl.beforeRoom)}</span>` : ""}</span>
          <span class="mv-arw" aria-hidden="true">→</span>
          <span class="mv-now"><b>${esc(sl.afterSubject)}</b> <i>${esc(sl.afterTeacher)}</i>${sl.roomClash
            ? ` <span class="room need" title="${esc(sl.afterRoom)}호가 그 시간에 사용 중입니다. 교실을 새로 배정해야 합니다.">교실 배정 필요</span>`
            : sl.afterRoom ? ` <span class="room">${esc(sl.afterRoom)}</span>` : ""}</span>`).join("")}
      </div>
      ${(s.strain || []).map(n => `<span class="strain ${n.heavy ? "hard" : ""}">${n.heavy ? "！" : "·"} ${strainLine(n)}</span>`).join("")}
      ${(s.over || []).map(n => `<span class="strain over">！ 한도 초과 — ${esc(overLine(n))}</span>`).join("")}
    </div></li>`).join("");
  const missed = plan.missed.map(l => missedItem(l, r)).join("");
  return `<article class="plan ${i === 0 ? "best" : ""}">
    <div class="plan-top">
      <div><div class="plan-name"><h3>대안 ${i + 1}${i === 0 ? " · 추천" : ""}</h3>
        ${sameDay ? '<b class="day-tag" title="그날 학교에 남아 다른 교시에 이 수업을 합니다">같은 날</b>' : ""}</div>
        <div class="load"><span>교체 ${done}건 · 수업 ${plan.steps.reduce((n, s) => n + s.length, 0)}개 이동</span>${burdenMeter(plan)}</div></div>
      <span class="chip ${miss || planIsHard(plan) ? "part" : "full"}">${miss ? `${fixed}/${fixed + miss} 해결` : planIsHard(plan) ? "전부 해결 · 부담 큼" : "전부 해결"}</span>
    </div>
    ${weekMap(plan, r)}
    <ol class="steps">${steps}${missed}</ol>
    ${repeats.length || rooms.length ? `<div class="repeat">${repeats.map(x =>
      `<span>${esc(x.className)} ${x.day}요일 <b>${esc(x.subject)} ${x.count}시간</b></span>`).join("")}${rooms.map(x =>
      `<span>${esc(x.className)} ${x.day} ${x.period}교시 ${esc(x.subject)} <b>교실 배정 필요</b> (${esc(x.room)}호 사용 중)</span>`).join("")}</div>` : ""}
    ${adviseBlock(plan, r)}
    <div class="plan-foot"><button class="ghost" type="button" data-copy="${i}">요약 복사</button><button class="ghost" type="button" data-report="${i}">신고서</button><button class="ghost" type="button" data-apply="${i}">전체 시간표에서 보기</button></div>
  </article>`;
}

function render(r) {
  const out = document.getElementById("out");
  if (!r.affected.length) {
    out.innerHTML = `<div class="banner none"><strong>${esc(r.absent.name)} 선생님은 ${r.sel.day}요일 ${periodLabel(r.sel)}에 담당 수업이 없습니다</strong>
      <p>다른 요일이나 결강 교시를 골라 보세요.</p></div>`;

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* 샌드박스에서 막힐 수 있음 */ }
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy"); ta.remove();
    } catch (e) { /* 아래 직접 선택으로 넘어감 */ }
  }
  if (ok) { btn.textContent = "복사했습니다"; setTimeout(() => { btn.textContent = "요약 복사"; }, 1600); return; }
  const card = btn.closest(".plan");
  if (card.querySelector(".paste")) return;
  const ta = document.createElement("textarea");
  ta.className = "paste"; ta.readOnly = true; ta.value = text;
  card.appendChild(ta); ta.focus(); ta.select();
  btn.textContent = "직접 선택해 복사";
}

/* ── .hwpx 만들기 (로컬에서 열었을 때) ────── */
const CRC = (() => { const t = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) { let c = i; for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; }
  return t; })();
const crc32 = b => { let v = 0xffffffff; for (let i = 0; i < b.length; i += 1) v = CRC[(v ^ b[i]) & 0xff] ^ (v >>> 8); return (v ^ 0xffffffff) >>> 0; };
const fromB64 = str => { const bin = atob(str); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i += 1) a[i] = bin.charCodeAt(i); return a; };

/* 중앙 디렉터리를 훑어 항목 목록을 만든다. 손대지 않는 항목은 압축된 채로 통과시킨다. */
function readZip(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0; i -= 1) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("양식 파일을 읽지 못했습니다");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = [];
  for (let i = 0; i < count; i += 1) {
    const method = dv.getUint16(p + 10, true);
    const crc = dv.getUint32(p + 16, true);
    const csize = dv.getUint32(p + 20, true);
    const usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    out.push({ name, method, crc, usize, data: buf.subarray(start, start + csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
const inflateRaw = bytes => pipe(bytes, new DecompressionStream("deflate-raw"));
async function packEntry(name, raw) {
  const usable = typeof CompressionStream !== "undefined";
  const data = usable ? await pipe(raw, new CompressionStream("deflate-raw")) : raw;
  return { name, method: usable ? 8 : 0, crc: crc32(raw), usize: raw.length, data };
}

function writeZip(entries) {
  const enc = new TextEncoder();
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const local = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name);
    const head = [...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(e.method), ...u16(0), ...u16(0x21),
      ...u32(e.crc), ...u32(e.data.length), ...u32(e.usize), ...u16(name.length), ...u16(0)];
    local.push(new Uint8Array(head), name, e.data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(e.method), ...u16(0), ...u16(0x21),
      ...u32(e.crc), ...u32(e.data.length), ...u32(e.usize), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset)]), name);
    offset += head.length + name.length + e.data.length;
  }
  const cdSize = central.reduce((n, part) => n + part.length, 0);
  const tail = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(entries.length), ...u16(entries.length),
    ...u32(cdSize), ...u32(offset), ...u16(0)]);
  const parts = [...local, ...central, tail];
  const total = parts.reduce((n, part) => n + part.length, 0);
  const buf = new Uint8Array(total);
  let at = 0;
  for (const part of parts) { buf.set(part, at); at += part.length; }
  return buf;
}

async function buildHwpx(plan, r) {
  const entries = readZip(fromB64(HWPX_TPL));
  const section = entries.find(e => e.name === "Contents/section0.xml");
  if (!section) throw new Error("양식에서 본문을 찾지 못했습니다");
  const xml = new TextDecoder().decode(section.method === 8 ? await inflateRaw(section.data) : section.data);

  const base = $("date").value ? fromValue($("date").value) : nextDateFor(r.sel.day);
  const data = {
    rows: HwpxFill.rowsFor(plan.steps, base),
    reason: r.sel.reason,
    teacherName: r.absent.name,
    schoolYear: HwpxFill.schoolYear(base),
  };
  const enc = new TextEncoder();
  const nextSection = await packEntry("Contents/section0.xml", enc.encode(HwpxFill.fillSection(xml, data)));
  const nextPrv = await packEntry("Preview/PrvText.txt", enc.encode(HwpxFill.buildPrvText(data)));

  return writeZip(entries.map(e =>
    e.name === "Contents/section0.xml" ? nextSection :
    e.name === "Preview/PrvText.txt" ? nextPrv : e));
}

$("report-save").addEventListener("click", async () => {
  if (!reportState) return;
  const { plan, r } = reportState;
  const base = $("date").value || "";
  const stem = `${r.absent.name}_${base}_${r.sel.reason}_교체수업신고서`.replace(/[\\/:*?"<>|]/g, "_");
  const btn = $("report-save");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    const bytes = await buildHwpx(plan, r);
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/hwp+zip" }));
    const a = document.createElement("a");
    a.href = url; a.download = stem + ".hwpx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    btn.textContent = "저장했습니다";
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 1800);
  } catch (e) {
    btn.textContent = "저장하지 못했습니다";
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2200);
  }
});

/* ── 전체 학반 시간표 ─────────────────────
   30개 학급을 한 판에 놓고, 고른 교체안을 적용한 모습까지 보여 준다. */
let applied = null;
let allMode = "class";   // "class" 학반별 | "teacher" 교사별

function renderAllClasses() {
  const slots = [];
  for (const d of DATA.days) for (let p = 1; p <= d.periods; p += 1) slots.push({ day: d.id, period: p });

  /* 교체안이 있으면 바뀔 칸을 미리 계산한다 — 학반 기준과 교사 기준을 함께 */
  const change = new Map();   // "cid|요일-교시" → {subject, teacher, room}
  const leave = new Set();    // "교사이름|요일-교시" — 이 자리를 떠나는 교사
  const arrive = new Map();   // "교사이름|요일-교시" → {classId, subject} — 이 자리로 오는 교사
  if (applied) {
    for (const step of applied.plan.steps) {
      for (const sl of step.slots) {
        const k = sl.day + "-" + sl.period;
        change.set(step.classId + "|" + k, { subject: sl.afterSubject, teacher: sl.afterTeacher, room: sl.afterRoom });
        leave.add(sl.beforeTeacher + "|" + k);
        arrive.set(sl.afterTeacher + "|" + k, { classId: step.classId, subject: sl.afterSubject });
      }
    }
  }
  const gone = new Set();     // 결강이라 비는 칸 (학반 기준)
  const away = new Set();     // 결강 교사가 자리를 비우는 교시
  if (applied) {
    for (const l of applied.r.affected) {
      const k = l.classId + "|" + l.day + "-" + l.period;
      if (!change.has(k)) gone.add(k);
      away.add(l.day + "-" + l.period);
    }
  }

  let head = '<tr><th scope="col" class="cn">' + (allMode === "class" ? "학반" : "교사") + '</th>';
  for (const d of DATA.days) {
    for (let p = 1; p <= d.periods; p += 1) {
      head += `<th scope="col" class="${p === 1 ? "daystart" : ""}">${p === 1 ? d.id : ""}<span>${p}</span></th>`;
    }
  }
  head += "</tr>";

  let body = "";
  if (allMode === "class") {
    for (const c of DATA.classes) {
      body += `<tr><th scope="row" class="cn">${esc(classLong(c.id))}</th>`;
      for (const sl of slots) {
        const key = c.id + "|" + sl.day + "-" + sl.period;
        const l = byClassSlot.get(key);
        const start = sl.period === 1 ? " daystart" : "";
        if (!l) { body += `<td class="none${start}"></td>`; continue; }
        const now = change.get(key);
        const empty = gone.has(key);
        const subject = now ? now.subject : l.subject;
        const teacher = now ? now.teacher : (T.get(l.teacherId) || {}).name || "";
        const kind = empty ? " empty" : now ? " moved" : "";
        body += `<td class="${l.type === "special" ? "sp" : ""}${kind}${start}" title="${esc(classLong(c.id))} ${sl.day}${sl.period} ${esc(subject)} ${esc(teacher)}">
          <b>${esc(subject)}</b><i>${esc(empty ? "결강" : teacher)}</i></td>`;
      }
      body += "</tr>";
    }
  } else {
    /* 교사별 — 한 줄이 한 선생님. 결강 교사가 비우는 교시는 자두빛, 옮겨 간 자리는 청록. */
    const absentName = applied ? applied.r.absent.name : "";
    const teachers = [...ACTIVE].sort((a, b) => a.name.localeCompare(b.name, "ko"));
    for (const t of teachers) {
      body += `<tr><th scope="row" class="cn">${esc(t.name)}</th>`;
      for (const sl of slots) {
        const k = sl.day + "-" + sl.period;
        const base = byTeacherSlot.get(t.id + "|" + k);
        const start = sl.period === 1 ? " daystart" : "";
        if (t.name === absentName && away.has(k)) {
          body += `<td class="empty${start}" title="${esc(t.name)} ${k} 결강"><b>결강</b><i>${esc(base ? classShort(base.classId) : "")}</i></td>`;
          continue;
        }
        const now = arrive.get(t.name + "|" + k);
        const l = now || (base && !leave.has(t.name + "|" + k) ? { classId: base.classId, subject: base.subject } : null);
        if (!l) { body += `<td class="none${start}"></td>`; continue; }
        body += `<td class="${now ? "moved" : ""}${start}" title="${esc(t.name)} ${k} ${esc(classLong(l.classId))} ${esc(l.subject)}">
          <b>${esc(classShort(l.classId))}</b><i>${esc(l.subject)}</i></td>`;
      }
      body += "</tr>";
    }
  }

  const note = applied
    ? `<div class="banner"><strong>대안 ${applied.index + 1} 적용 화면 · ${esc(applied.r.absent.name)} 선생님 ${applied.r.sel.day}요일 ${periodLabel(applied.r.sel)}</strong>
        <p>${allMode === "class" ? "바뀌는 칸은 청록으로, 아직 채우지 못한 칸은 자두빛으로" : "옮겨 간 수업은 청록으로, 결강 선생님이 자리를 비우는 교시는 자두빛으로"} 표시했습니다. 실제 시간표는 바뀌지 않습니다.
        <button class="ghost" type="button" id="all-clear" style="margin-left:8px">원래대로 보기</button></p></div>`
    : `<div class="banner none"><strong>${esc(DATA.name.replace(/\s*시간표$/, ""))} · 전체 ${allMode === "class" ? "학반" : "교사"} 시간표</strong>
        <p>수업 교체에서 대안을 고른 뒤 ‘전체 시간표에서 보기’를 누르면 바뀐 모습을 여기서 확인할 수 있습니다.</p></div>`;

  $("all-out").innerHTML = note +
    `<div class="all-wrap"><table class="all"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  const clear = $("all-clear");
  if (clear) clear.addEventListener("click", () => { applied = null; renderAllClasses(); });
}
const allSetMode = mode => {
  allMode = mode;
  $("all-by-class").setAttribute("aria-pressed", String(mode === "class"));
  $("all-by-teacher").setAttribute("aria-pressed", String(mode === "teacher"));
  renderAllClasses();
};
$("all-by-class").addEventListener("click", () => allSetMode("class"));
$("all-by-teacher").addEventListener("click", () => allSetMode("teacher"));

/* ── 결강 날짜 ↔ 요일 연동 ───────────────── */
const DAY_NUM = { 월:1, 화:2, 수:3, 목:4, 금:5 };
const pad = n => String(n).padStart(2, "0");
const toValue = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromValue = v => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };

function nextDateFor(dayId, from) {
  const target = DAY_NUM[dayId] || 1;
  const d = from ? new Date(from.getTime()) : new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + ((target - d.getDay() + 7) % 7));
  return d;
}
/* 요일은 날짜에서 나온다. 요일 상자를 따로 두면 두 상자가 서로를 가리켜 헷갈리므로,
   숨긴 값 하나로 들고 날짜 라벨 옆에만 보여 준다. */
function setDay(id) {
  $("day").value = id;
  $("day-label").textContent = id + "요일";
  fillPeriods();
}
$("date").value = toValue(nextDateFor($("day").value));
$("day-label").textContent = $("day").value + "요일";
$("date").addEventListener("change", () => {
  if (!$("date").value) return;
  const d = fromValue($("date").value);
  const id = Object.keys(DAY_NUM).find(k => DAY_NUM[k] === d.getDay());
  if (id) { setDay(id); return; }
  // 주말을 고르면 다음 월요일로 옮긴다. 그대로 두면 신고서의 날짜가 한 주 뒤로 밀린다.
  $("date").value = toValue(nextDateFor("월", d)); setDay("월");
});

/* ── 화면 전환 ───────────────────────────── */
const TABS = [["tab-swap", "panel-swap"], ["tab-tt", "panel-tt"], ["tab-all", "panel-all"]];
for (const [tabId, panelId] of TABS) {
  $(tabId).addEventListener("click", () => {
    for (const [t, p] of TABS) {
      const on = t === tabId;
      $(t).setAttribute("aria-selected", String(on));
      $(p).hidden = !on;
    }
    if (panelId === "panel-tt") renderTimetable();
    if (panelId === "panel-all") renderAllClasses();
    window.scrollTo({ top: 0 });
  });
}

/* ── 전체 시간표 ─────────────────────────── */
let ttMode = "class";
const ttSetMode = mode => {
  ttMode = mode;
  $("tt-by-class").setAttribute("aria-pressed", String(mode === "class"));
  $("tt-by-teacher").setAttribute("aria-pressed", String(mode === "teacher"));
  fillEntities();
  renderTimetable();
};
$("tt-by-class").addEventListener("click", () => ttSetMode("class"));
$("tt-by-teacher").addEventListener("click", () => ttSetMode("teacher"));
$("tt-entity").addEventListener("change", renderTimetable);

function fillEntities() {
  const list = ttMode === "class"
    ? DATA.classes.map(c => ({ id: c.id, label: classLong(c.id) }))
    : ACTIVE.map(t => ({ id: t.id, label: t.name + (t.subjects.length ? " · " + t.subjects.join("/") : "") }));
  $("tt-entity").innerHTML = list.map(x => `<option value="${x.id}">${esc(x.label)}</option>`).join("");
}

function renderTimetable() {
  const id = $("tt-entity").value;
  if (!id) return;
  const lessonAt = (day, period) => ttMode === "class"
    ? byClassSlot.get(id + "|" + day + "-" + period)
    : byTeacherSlot.get(id + "|" + day + "-" + period);

  let body = "";
  for (let p = 1; p <= MAXP; p += 1) {
    body += `<tr><th scope="row">${p}</th>`;
    for (const d of DATA.days) {
      if (p > d.periods) { body += '<td class="free" aria-hidden="true"></td>'; continue; }
      const l = lessonAt(d.id, p);
      if (!l) { body += '<td class="free"></td>'; continue; }
      const side = ttMode === "class"
        ? (T.get(l.teacherId)?.name || "")
        : classLong(l.classId);
      const room = l.room || "";
      body += `<td><span class="tt-sub">${esc(l.subject)}</span><span class="tt-meta">${esc(side)}${room ? " · " + esc(room) : ""}</span></td>`;
    }
    body += "</tr>";
  }

  const lessons = ttMode === "class"
    ? DATA.schedule.filter(l => l.classId === id)
    : (byTeacher.get(id) || []);
  const regular = lessons.filter(l => l.type !== "special").length;
  const daysUsed = new Set(lessons.map(l => l.day)).size;
  const partner = ttMode === "class"
    ? new Set(lessons.map(l => l.teacherId).filter(Boolean)).size + "명"
    : new Set(lessons.map(l => l.classId)).size + "개";
  const partnerLabel = ttMode === "class" ? "담당 교사" : "맡는 학급";
  const teacher = ttMode === "teacher" ? T.get(id) : null;

  $("tt-out").innerHTML = `
    <div class="tt-wrap"><table class="tt">
      <thead><tr><th scope="col">교시</th>${DATA.days.map(d => `<th scope="col">${esc(d.label)}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    <p class="tt-tally">
      <span>주당 수업 <b>${regular}</b>시간</span>
      <span>수업 있는 날 <b>${daysUsed}</b>일</span>
      <span>${partnerLabel} <b>${partner}</b></span>
      ${teacher ? `<span>근무 요일 <b>${esc(teacher.allowedDays.join(""))}</b></span>` : ""}
    </p>`;
}
fillEntities();

/* ── 주소로 조건 미리 채우기 ─────────────────
   ?teacher=이승열&date=2026-10-05&periods=1,3&reason=출장
   teacher는 이름이나 id, periods는 "1,3"이나 "all". 교사와 교시가 모두 있으면 바로 계산한다.
   AI 교무실이 계산 결과를 보여 준 뒤 "이 조건으로 열기"를 누르면 이리로 온다.
   맞지 않는 값은 조용히 넘기고, 주소가 없으면 예전과 똑같이 연다. */
{
  const q = new URLSearchParams(location.search);
  const who = (q.get("teacher") || "").trim();
  const t = who && ACTIVE.find(x => x.id === who || x.name === who);
  if (t) { $("teacher").value = t.id; fillPeriods(); }
  const date = q.get("date") || "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(date) && !Number.isNaN(fromValue(date).getTime())) {
    $("date").value = date;
    $("date").dispatchEvent(new Event("change"));   // 요일 맞추기·주말이면 월요일로
  }
  const reason = q.get("reason");
  if (reason && [...$("reason").options].some(o => o.value === reason)) $("reason").value = reason;
  const raw = (q.get("periods") || "").trim();
  if (raw) {
    const want = raw === "all" ? null : new Set(raw.split(",").map(Number));
    let any = false;
    for (const b of document.querySelectorAll("#periods input[value]")) {
      b.checked = !want || want.has(Number(b.value));
      any = any || b.checked;
    }
    syncAll();
    if (t && any) $("go").click();
  }
}
</script>
